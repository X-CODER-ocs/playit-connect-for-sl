name: build playit for sl

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  release:
    types: [created]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            os-name: macOS
            arch: arm64
            name: playitd-macos-arm64
            ext: ""
          - os: macos-13
            target: x86_64-apple-darwin
            os-name: macOS
            arch: x64
            name: playitd-macos-x86_64
            ext: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os-name: linux
            arch: amd64
            name: playitd-linux-amd64
            ext: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            os-name: linux
            arch: arm64
            name: playitd-linux-arm64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            os-name: windows
            arch: x64
            name: playitd-windows-x86_64.exe
            ext: ".exe"
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            os-name: windows
            arch: arm64
            name: playitd-windows-arm64.exe
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Native linkers for Linux ARM64 cross-compilation.
      - name: Install Linux ARM64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build playitd (${{ matrix.os-name }} ${{ matrix.arch }})
        run: cargo build --release --target ${{ matrix.target }} --package playitd

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p out
          cp "target/${{ matrix.target }}/release/playitd${{ matrix.ext }}" "out/${{ matrix.name }}"
          chmod +x "out/${{ matrix.name }}" 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/${{ matrix.name }}
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ matrix.name }}